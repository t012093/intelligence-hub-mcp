[project]
name = "intelligence-hub-mcp"
version = "0.1.0"
description = "Multi-domain intelligence intake, crossover analysis & publishing MCP server"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.10",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "lancedb>=0.20.0",
    "pyarrow>=14.0.0",
    "camoufox[geoip]>=0.4.11",
    "google-genai>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
intelligence-hub-mcp = "intelligence_hub.mcp.server:main"
intelligence-hub-cron = "intelligence_hub.scheduler:main"
intelligence-hub-publish = "intelligence_hub.publishing.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
